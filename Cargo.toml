[package]
name = "ecs-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0 AND MIT AND BSD-3-Clause"
description = "Bounded-memory streaming erasure coding for local and distributed storage engines."
keywords = ["erasure", "reed-solomon", "streaming", "simd", "storage"]
categories = ["algorithms", "asynchronous", "filesystem"]

[workspace]
members = ["."]
exclude = ["vendor/simd-erasure-core"]
resolver = "2"

[dependencies]
crc32fast = "1.5.0"
futures-util = "0.3.31"
hex = "0.4.3"
libc = "0.2.175"
rayon = "1.11.0"
ring = "0.17.14"
simd-erasure-core = { path = "vendor/simd-erasure-core" }
tokio = { version = "1.47.1", features = ["fs", "io-util"] }
tracing = "0.1.41"

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
rand = "0.9.2"
rand_chacha = "0.9.0"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bench]]
name = "streaming"
harness = false
